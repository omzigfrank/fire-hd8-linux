Syntax 6

Comment "Amazon Fire HD 8 (2017, douglas)"

SectionUseCase."HiFi" {
	File "/MediaTek/douglas/HiFi.conf"
	Comment "Play HiFi quality Music"
}

BootSequence [
	cset "name='I2S1_CH1 DL1_CH1' on"
	cset "name='I2S1_CH2 DL1_CH2' on"
	cset "name='Headphone Playback Volume' 3"
	cset "name='Speaker Switch' off"
	cset "name='Headphone Switch' off"
]
