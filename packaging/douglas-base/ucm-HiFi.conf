SectionVerb {
	EnableSequence [
		cset "name='I2S1_CH1 DL1_CH1' on"
		cset "name='I2S1_CH2 DL1_CH2' on"
		cset "name='VUL_CH1 I2S2_CH1' on"
		cset "name='VUL_CH2 I2S2_CH2' on"
	]
	Value {
		TQ "HiFi"
	}
}

# MT6323 headphone buffers drive both the external speaker amp and the jack.
SectionDevice."Speaker" {
	Comment "Speakers"
	ConflictingDevice [
		"Headphones"
	]
	EnableSequence [
		cset "name='Headphone Switch' off"
		cset "name='Speaker Switch' on"
	]
	DisableSequence [
		cset "name='Speaker Switch' off"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackVolume "Headphone Playback Volume"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	ConflictingDevice [
		"Speaker"
	]
	EnableSequence [
		cset "name='Speaker Switch' off"
		cset "name='Headphone Switch' on"
	]
	DisableSequence [
		cset "name='Headphone Switch' off"
	]
	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
		PlaybackVolume "Headphone Playback Volume"
	}
}

# MT6323 ADC1: the built-in (main) analog microphone
SectionDevice."Mic" {
	Comment "Internal Microphone"
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureVolume "Mic Capture Volume"
	}
}
